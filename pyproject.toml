[project]
name = "ticket-master"
version = "0.1.0"
description = "An event-driven ticket booking system using Django, FastAPI, RabbitMQ, and PostgreSQL."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.2",
    "dj-database-url>=3.1.0",
    "django>=6.0.1",
    "django-cors-headers>=4.9.0",
    "django-crum>=0.7.9",
    "django-environ>=0.12.0",
    "django-query-counter>=0.4.2",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "google-auth>=2.48.0",
    "psycopg2-binary>=2.9.11",
    "pytz>=2025.2",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "ruff>=0.14.10",
]
